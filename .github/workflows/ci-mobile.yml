# =============================================================================
#  CI ? Mobile (Expo / React Native)
#  Validates that dependencies install cleanly and Expo can start.
# =============================================================================
name: CI - Mobile

on:
  push:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "mobile/**"
      - ".github/workflows/ci-mobile.yml"

jobs:
  install-check:
    name: Install & Validate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      # ?? Checkout ????????????????????????????????????????????????????????????
      - name: Checkout repository
        uses: actions/checkout@v4

      # ?? Node setup ??????????????????????????????????????????????????????????
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ?? Install ?????????????????????????????????????????????????????????????
      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      # ?? Expo doctor (validates project config) ???????????????????????????????
      - name: Run expo doctor
        working-directory: mobile
        run: npx expo-doctor@latest || true
