# =============================================================================
#  CI ? API (Python / FastAPI)
#  Runs on every push and pull-request that touches the api/ folder or
#  the root requirements files.
# =============================================================================
name: CI - API

on:
  push:
    branches: [main, dev]
    paths:
      - "api/**"
      - "requirements.txt"
      - ".github/workflows/ci-api.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "api/**"
      - "requirements.txt"
      - ".github/workflows/ci-api.yml"

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.9", "3.10"]

    steps:
      # ?? Checkout ????????????????????????????????????????????????????????????
      - name: Checkout repository
        uses: actions/checkout@v4

      # ?? Python setup ????????????????????????????????????????????????????????
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ?? Install dependencies ????????????????????????????????????????????????
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black
          pip install -r api/requirements.txt

      # ?? Lint ????????????????????????????????????????????????????????????????
      - name: Lint with flake8
        run: |
          flake8 api/ --max-line-length=120 --exclude=__pycache__ \
            --count --statistics

      # ?? Format check ????????????????????????????????????????????????????????
      - name: Check formatting with black
        run: |
          black api/ --check --line-length=120

      # ?? Import check ????????????????????????????????????????????????????????
      - name: Verify API imports
        run: |
          python -c "import fastapi; import uvicorn; import pydantic; print('All imports OK')"

      # ?? Dependency audit ????????????????????????????????????????????????????
      - name: Check dependency compatibility
        run: python check_deps.py
