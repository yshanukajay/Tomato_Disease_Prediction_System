# =============================================================================
#  CI ? Frontend (React)
#  Runs on every push and pull-request that touches the frontend/ folder.
# =============================================================================
name: CI - Frontend

on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"

jobs:
  build:
    name: Install & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      # ?? Checkout ????????????????????????????????????????????????????????????
      - name: Checkout repository
        uses: actions/checkout@v4

      # ?? Node setup ??????????????????????????????????????????????????????????
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ?? Install ?????????????????????????????????????????????????????????????
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ?? Build ???????????????????????????????????????????????????????????????
      - name: Production build
        working-directory: frontend
        env:
          # Prevent treating warnings as errors during CI
          CI: false
          REACT_APP_API_URL: http://localhost:8000
        run: npm run build

      # ?? Upload build artefact ????????????????????????????????????????????????
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-node${{ matrix.node-version }}
          path: frontend/build/
          retention-days: 7
