<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title>Tomato Leaf Mark</title>
  <desc>Tomato-shaped favicon with green leaves for agriculture</desc>
  <defs>
    <linearGradient id="tomatoRed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f44336" />
      <stop offset="55%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#d32f2f" />
    </linearGradient>
    <linearGradient id="leafGreen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2e7d32" />
      <stop offset="100%" stop-color="#66bb6a" />
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#ffcdd2" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffcdd2" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#b71c1c" flood-opacity="0.28" />
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- Tomato body -->
    <path fill="url(#tomatoRed)" d="M20 20c6-6 18-7 24 0 8 1 12 8 12 15 0 11-9 19-24 19S8 46 8 35c0-7 4-14 12-15Z" />
    <!-- Highlight -->
    <ellipse cx="28" cy="24" rx="8" ry="6" fill="url(#highlight)" />
    <!-- Leaves -->
    <path fill="url(#leafGreen)" d="M32 16c-4-4-9-5-12-3 2 1 4 4 4 6-3-2-7-3-10-1 2 1 4 3 5 5-3-1-6 0-7 2 3 0 7 1 9 2 4 2 7 3 11 0 3-3 8-4 11-4-2-3-7-4-11-7Z" />
    <!-- Stem line -->
    <path stroke="#1b5e20" stroke-width="2.4" stroke-linecap="round" fill="none" d="M32 16c0 3-0.5 6-1 8" />
  </g>
</svg>
