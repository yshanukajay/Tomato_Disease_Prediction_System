version: '3.8'

services:
  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: tomato-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./models:/app/models
    networks:
      - tomato-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tomato-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tomato-network

  # Mobile App Service (Expo)
  mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile
    container_name: tomato-mobile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "8081:8081"
    environment:
      - REACT_APP_API_URL=http://api:8000
      - EXPO_USE_HTTPS=false
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tomato-network

networks:
  tomato-network:
    driver: bridge
